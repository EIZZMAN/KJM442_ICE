<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KJM442: Interactive P-V Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 900px; margin-top: 30px; }
        #piston-container { background: #f8f9fa; border-radius: 10px; padding: 20px; text-align: center; }
        .canvas-container { position: relative; height: 300px; }
    </style>
</head>
<body class="bg-light">

<div class="container bg-white p-4 shadow rounded">
    <h2 class="text-center text-primary">Simulator Piston vs Graf P-V</h2>
    <hr>

    <div class="row align-items-center">
        <div class="col-md-5" id="piston-container">
            <h5>Animasi Enjin</h5>
            <svg width="150" height="250" viewBox="0 0 150 250">
                <rect x="30" y="20" width="90" height="180" fill="none" stroke="#333" stroke-width="4"/>
                <rect id="piston" x="35" y="100" width="80" height="50" rx="5" fill="#7f8c8d" />
                <line id="rod" x1="75" y1="150" x2="75" y2="210" stroke="#34495e" stroke-width="6" />
                <circle cx="75" cy="210" r="15" fill="none" stroke="#e74c3c" stroke-width="3" />
            </svg>
            <div class="mt-3">
                <button class="btn btn-success btn-sm" onclick="startEngine()">Start</button>
                <button class="btn btn-danger btn-sm" onclick="stopEngine()">Stop</button>
            </div>
        </div>

        <div class="col-md-7">
            <canvas id="pvChart"></canvas>
        </div>
    </div>
</div>

<script>
    let animationId;
    let angle = 0;
    const ctx = document.getElementById('pvChart').getContext('2d');

    // Data untuk lengkung P-V yang tetap (Ideal Otto Cycle)
    const curveData = [];
    for (let v = 1; v <= 10; v += 0.5) {
        curveData.push({x: v, y: 100 / Math.pow(v, 1.4)});
    }

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [
                {
                    label: 'P-V Curve',
                    data: curveData,
                    borderColor: '#3498db',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false,
                    tension: 0.4
                },
                {
                    label: 'Current State',
                    data: [{x: 5, y: 10}],
                    backgroundColor: 'red',
                    pointRadius: 8,
                    showLine: false
                }
            ]
        },
        options: {
            scales: {
                x: { type: 'linear', title: { display: true, text: 'Volume (V)' }, min: 1, max: 10 },
                y: { title: { display: true, text: 'Pressure (P)' }, min: 0, max: 110 }
            }
        }
    });

    function animate() {
        angle += 0.05;
        
        // Gerakan piston (Harmonic motion)
        // y bervariasi antara 30 (Top Dead Center) dan 110 (Bottom Dead Center)
        const yPos = 70 + Math.cos(angle) * 40; 
        document.getElementById('piston').setAttribute('y', yPos);
        
        // Update Rod
        document.getElementById('rod').setAttribute('y1', yPos + 50);

        // Update Titik pada Graf
        // Volume berkadar terus dengan yPos piston
        const currentV = 1 + ((yPos - 30) / 80) * 9; 
        const currentP = 100 / Math.pow(currentV, 1.4);

        chart.data.datasets[1].data = [{x: currentV, y: currentP}];
        chart.update('none'); // Update tanpa animasi chart supaya laju

        animationId = requestAnimationFrame(animate);
    }

    function startEngine() { if (!animationId) animate(); }
    function stopEngine() { cancelAnimationFrame(animationId); animationId = null; }
</script>

</body>
</html>
